<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harmonies</title>
</head>

<body>
  <div id="token-menu">
    <input type="radio" id="blue-radio" name="color" value="Blue" checked>
    <label for="blue-radio">River</label>
    <input type="radio" id="gray-radio" name="color" value="Gray">
    <label for="gray-radio">Mountain</label>
    <input type="radio" id="brown-radio" name="color" value="Brown">
    <label for="brown-radio">Wood</label>
    <input type="radio" id="green-radio" name="color" value="Green">
    <label for="green-radio">Leaves</label>
    <input type="radio" id="yellow-radio" name="color" value="Yellow">
    <label for="yellow-radio">Field</label>
    <input type="radio" id="red-radio" name="color" value="Red">
    <label for="red-radio">Bricks</label>
  </div>

  <div class="game-zone">
    <div class="game-zone-left">
      <figure class="draft-table-container orientation-player-1">
        <img class="draft-table" src="draft_table.png" alt="Draft table">
        <svg id="draft-table" viewBox="0 0 666 675"></svg>
      </figure>
      <div class="token-holder"></div>
    </div>
    <figure class="game-board-container">
      <img class="hex-board" src="" alt="Hex board">
      <svg id="hex-board" viewBox="0 0 800 642"></svg>
    </figure>
  </div>
  <div class="animal-cards-container">
    <img class="animal-card" src="animals/eagle.png" alt="eagle">
    <img class="animal-card" src="animals/kingfisher.png" alt="kingfisher">
    <img class="animal-card" src="animals/ladybug.png" alt="ladybug">
  </div>
  <svg id="hex-pattern" width="200" height="200"></svg>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
