<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harmonies</title>
</head>

<body>
  <div id="token-menu">
    <input type="radio" id="blue-radio" name="color" value="Blue" checked>
    <label for="blue-radio">River</label>
    <input type="radio" id="gray-radio" name="color" value="Gray">
    <label for="gray-radio">Mountain</label>
    <input type="radio" id="brown-radio" name="color" value="Brown">
    <label for="brown-radio">Wood</label>
    <input type="radio" id="green-radio" name="color" value="Green">
    <label for="green-radio">Leaves</label>
    <input type="radio" id="yellow-radio" name="color" value="Yellow">
    <label for="yellow-radio">Field</label>
    <input type="radio" id="red-radio" name="color" value="Red">
    <label for="red-radio">Bricks</label>
  </div>
  <button class="show-deck-btn">Show animal cards</button>

  <div class="game-zone">
    <div class="game-zone-left">
      <figure class="draft-table-container orientation-player-1"></figure>
    </div>
    <figure class="game-board-container"></figure>
  </div>

  <dialog class="animal-deck-modal"></dialog>

  <script type="module" src="/src/main.ts"></script>
  <script type="module">
    const confirmButton = document.querySelector('.confirm-pick-btn');
    const cancelButton = document.querySelector('.cancel-pick-btn');
    const cardPicker = document.querySelector('.card-picker');
    let animalCards = document.querySelectorAll('.animal-cards-container .animal-card');

    // Function to sort elements by data-timestamp attribute
    function sortElementsByTimestamp(elements) {
      return Array.from(elements).sort((a, b) => {
        return parseInt(a.getAttribute('data-timestamp')) - parseInt(b.getAttribute('data-timestamp'));
      });
    }

    // open the dialog
    document.querySelector('.show-deck-btn').addEventListener('click', () => {
      document.querySelector('.animal-deck-modal').showModal();
    });

    // confirm the picked card
    confirmButton.addEventListener('click', () => {
      const pickedCard = cardPicker.querySelector('.animal-card');
      if (!pickedCard) return;

      pickedCard.remove();
      animalCards = document.querySelectorAll('.animal-cards-container .animal-card');
      animalCards.forEach(card => {
        card.setAttribute('draggable', true);
      });

      cancelButton.disabled = true;
      confirmButton.disabled = true;
    });

    // close the dialog
    document.querySelector('.close-deck-btn').addEventListener('click', () => {
      document.querySelector('.animal-deck-modal').close();
      const pickedCard = cardPicker.querySelector('.animal-card');
      if (!pickedCard) return;

      const container = document.querySelector('.animal-cards-container');
      const sortedCards = sortElementsByTimestamp(animalCards);
      sortedCards.forEach(card => {
        card.setAttribute('draggable', true);
        container.appendChild(card);
      });

      cancelButton.disabled = true;
      confirmButton.disabled = true;
    });

    // cancel the picked card
    cancelButton.addEventListener('click', () => {
      const pickedCard = cardPicker.querySelector('.animal-card');
      if (!pickedCard) return;

      const container = document.querySelector('.animal-cards-container');
      const sortedCards = sortElementsByTimestamp(animalCards);
      sortedCards.forEach(card => {
        card.setAttribute('draggable', true);
        container.appendChild(card);
      });

      cancelButton.disabled = true;
      confirmButton.disabled = true;
    });

    // drag and drop
    animalCards.forEach(card => {
      card.addEventListener('dragstart', () => {
        card.classList.add('dragging');
      });

      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
      });
    });

    cardPicker.addEventListener('dragover', (event) => {
      event.preventDefault();
    });

    cardPicker.addEventListener('drop', (event) => {
      const draggedCard = document.querySelector('.dragging');
      cardPicker.appendChild(draggedCard);
      animalCards.forEach(card => {
        card.setAttribute('draggable', false);
      });

      cancelButton.disabled = false;
      confirmButton.disabled = false;
    });

  </script>
</body>

</html>
